<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>জীবন ও বৃক্ষ</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;500;700&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #1A0A0F;
            --glass-core: rgba(107, 15, 32, 0.55);
            --glass-border: rgba(240, 100, 120, 0.12);
            --accent: #F2A0AE;
            --accent-glow: rgba(192, 37, 62, 0.35);
            --text-primary: #FDE8EC;
            --text-secondary: #C26070;
            --card-radius: 28px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(56, 189, 248, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(56, 189, 248, 0.05) 0%, transparent 40%);
            background-attachment: fixed;
            line-height: 1.6;
            padding-bottom: 120px;
        }

        /* --- High-End Header --- */
        header {
            padding: 80px 20px 40px;
            text-align: center;
            border-bottom: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
        }

        .category-tag {
            font-family: 'Outfit', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 5px;
            color: var(--accent);
            text-transform: uppercase;
            background: rgba(56, 189, 248, 0.1);
            padding: 6px 15px;
            border-radius: 50px;
            border: 1px solid var(--accent-glow);
        }

        header h1 {
            font-size: 3.5rem;
            margin: 20px 0 10px;
            font-weight: 700;
            background: linear-gradient(to bottom, #fff 30%, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p { color: var(--text-secondary); font-weight: 300; }

        /* --- Floating Navigation HUD --- */
        .mastery-hud {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 700px;
            background: var(--glass-core);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            z-index: 2000;
        }

        .progress-container { flex-grow: 1; margin: 0 40px; }
        .progress-label { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 8px; }
        .bar-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.05); border-radius: 10px; overflow: hidden; }
        .bar-fill { height: 100%; width: 0%; background: var(--accent); box-shadow: 0 0 15px var(--accent); transition: 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }

        /* --- CQ Analysis Cards --- */
        .container { width: 100%; max-width: 850px; margin: 50px auto; padding: 0 20px; }

        .cq-card {
            background: var(--glass-core);
            border: 1px solid var(--glass-border);
            border-radius: var(--card-radius);
            padding: 35px;
            margin-bottom: 30px;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .cq-card:hover {
            border-color: rgba(56, 189, 248, 0.4);
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .q-meta { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .q-index {
            background: var(--accent);
            color: #000;
            width: 28px; height: 28px;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-family: 'Outfit';
        }
        .q-tag { color: var(--accent); font-size: 0.85rem; font-weight: 600; text-transform: uppercase; }

        .q-statement { font-size: 1.4rem; font-weight: 500; color: #fff; margin-bottom: 25px; line-height: 1.4; }

        /* --- Premium Reveal Button --- */
        .reveal-trigger {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 12px 25px;
            border-radius: 15px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
        }

        .reveal-trigger:hover { background: var(--accent); color: #000; border-color: var(--accent); }

        /* --- Answer Drawer --- */
        .ans-drawer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(0, 0, 0, 0.2);
            border-radius: 20px;
        }

        .is-active .ans-drawer { max-height: 1000px; margin-top: 25px; border: 1px solid rgba(56, 189, 248, 0.1); }
        .is-active .reveal-trigger { background: var(--accent); color: #000; }

        .ans-body { padding: 25px; color: var(--text-secondary); font-size: 1.15rem; border-left: 4px solid var(--accent); }
        .ans-body strong { color: var(--accent); display: block; margin-bottom: 10px; font-size: 0.9rem; text-transform: uppercase; }

        /* --- Global Controls --- */
        .btn-ghost {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            padding: 8px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Outfit';
            font-size: 0.8rem;
            transition: 0.3s;
        }
        .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

        @media (max-width: 600px) {
            header h1 { font-size: 2.2rem; }
            .mastery-hud { flex-direction: column; gap: 15px; padding: 20px; border-radius: 25px; }
            .progress-container { margin: 10px 0; width: 100%; }
        }
    </style>
</head>
<style>
    .back-nav {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 1000;
    }

    .btn-back {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #fff;
        padding: 8px 16px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: all 0.3s ease;
        cursor: pointer;
    }

    .btn-back:hover {
        background: rgba(255, 255, 255, 0.1);
        transform: translateX(-5px);
        border-color: #00d2ff;
    }

    .btn-back i {
        color: #00d2ff;
    }
</style>

<body>

<!-- BACK BUTTON -->
<div class="back-nav">
    <button class="btn-back" onclick="history.back()">
        <i class="fas fa-chevron-left"></i> ফিরে যান
    </button>
</div>

    <header>
        <span class="category-tag">bangla first paper</span>
        <h1>জীবন ও বৃক্ষ</h1>
        <p>মোতাহার হোসেন চৌধুরী — জ্ঞানমূলক ও অনুধাবনমূলক প্রশ্নোত্তর</p>
    </header>

    <div class="mastery-hud">
        <div class="hud-label" style="font-family:'Outfit'">TOPICS</div>
        <div class="progress-container">
            <div class="progress-label">
                <span>Mastery Progress</span>
                <span id="prog-percent">0%</span>
            </div>
            <div class="bar-bg"><div class="bar-fill" id="progress-bar"></div></div>
        </div>
        <button class="btn-ghost" onclick="toggleAll()">REVEAL ALL</button>
    </div>

    <main class="container" id="cq-list"></main>

    <script>
        const analysisData = [
  { q: "‘জীবন ও বৃক্ষ’ প্রবন্ধটি কে লিখেছেন?", a: "‘জীবন ও বৃক্ষ’ প্রবন্ধটি লিখেছেন মোতাহার হোসেন চৌধুরী।" },
{ q: "মোতাহার হোসেন চৌধুরী কী রচনায় সিদ্ধহস্ত ছিলেন?", a: "মোতাহার হোসেন চৌধুরী মননশীল ও চিন্তাশীল রচনায় সিদ্ধহস্ত ছিলেন।" },
{ q: "‘জীবন ও বৃক্ষ’ প্রবন্ধটি লেখকের কোন গ্রন্থ থেকে সংকলিত হয়েছে?", a: "‘জীবন ও বৃক্ষ’ প্রবন্ধটি লেখকের ‘সংস্কৃতি কথা’ গ্রন্থ থেকে সংকলিত হয়েছে।" },
{ q: "মোতাহার হোসেন চৌধুরী কত তারিখে মৃত্যুবরণ করেন?", a: "মোতাহার হোসেন চৌধুরী ১৯৫৬ সালের ১৮ই সেপ্টেম্বর মৃত্যুবরণ করেন।" },
{ q: "‘জীবন ও বৃক্ষ’ প্রবন্ধে বড় মানুষের বৃদ্ধি কেমন হয়?", a: "‘জীবন ও বৃক্ষ’ প্রবন্ধে বড় মানুষের বৃদ্ধি সুপ্ত হয়।" },
{ q: "রবীন্দ্রনাথ ঠাকুর মানুষের জীবনকে কীসের সাথে তুলনা করেছেন?", a: "রবীন্দ্রনাথ ঠাকুর মানুষের জীবনকে নদীর গতির সাথে তুলনা করেছেন।" },
{ q: "নদীর সাগরে পতিত হওয়া প্রাপ্তি নয়, তবে কী?", a: "নদীর সাগরে পতিত হওয়া প্রাপ্তি নয়, আত্মবিসর্জন।" },
{ q: "পরিপক্কতা সম্পর্কে মহাকবি কী বলেছেন?", a: "পরিপক্কতা সম্পর্কে মহাকবি বলেছেন— ‘Ripeness is all.’" },
{ q: "‘জীবন ও বৃক্ষ’ প্রবন্ধ মতে, কীসের দ্বারা মানুষের অন্তর পরিপূর্ণ হয়?", a: "‘জীবন ও বৃক্ষ’ প্রবন্ধ মতে, সাহিত্য-শিল্পকলায় দ্বারা মানুষের অন্তর পরিপূর্ণ হয়।" },
{ q: "বৃক্ষের অঙ্কুরিত হওয়া থেকে ফলবান হওয়া কীসের ইতিহাস?", a: "বৃক্ষের অঙ্কুরিত হওয়া থেকে ফলবান হওয়া বৃদ্ধির ইতিহাস।" },
{ q: "কীসের দিকে তাকিয়ে জীবনের গূঢ় অর্থ সম্পর্কে সচেতন হওয়া যায়?", a: "বৃক্ষের দিকে তাকিয়ে জীবনের গূঢ় অর্থ সম্পর্কে সচেতন হওয়া যায়।" },
{ q: "‘নতি’ শব্দের অর্থ কী?", a: "‘নতি’ শব্দের অর্থ অবনত ভাব।" },
{ q: "‘গোপন ও নীরব সাধনা’ কীসে অভিব্যক্ত হয়?", a: "গোপন ও নীরব সাধনা বৃক্ষে অভিব্যক্ত হয়।" },
{ q: "প্রবন্ধ মতে, নিষ্ঠুর ও বিকৃতবুদ্ধির অধিকারী কারা?", a: "প্রবন্ধ মতে, নিষ্ঠুর ও বিকৃতবুদ্ধির অধিকারী তারা যারা প্রেম ও সৌন্দর্যের স্পর্শ লাভ করেনি।" },
{ q: "কীসের দ্বারা জীবনবোধ ও মূল্যবোধে অন্তর পরিপূর্ণ হয়ে ওঠে?", a: "সাহিত্য ও শিল্পকলার দ্বারা জীবনবোধ ও মূল্যবোধে অন্তর পরিপূর্ণ হয়ে ওঠে।" },
{ q: "‘তপোবন’ কী?", a: "‘তপোবন’ হলো অরণ্যে ঋষির আশ্রম।" },
{ q: "কীসের দিকে তাকালে জীবনের তাৎপর্য উপলব্ধি করা সহজ হয়?", a: "বৃক্ষের দিকে তাকালে জীবনের তাৎপর্য উপলব্ধি করা সহজ হয়।" },
{ q: "প্রাবন্ধিক কোনটিকে মনুষ্যত্বের প্রতীক করতে চেয়েছেন?", a: "প্রাবন্ধিক বৃক্ষকে মনুষ্যত্বের প্রতীক করতে চেয়েছেন।" },
{ q: "সমাজের আসল কাজ কী?", a: "সমাজের কাজ শুধু টিকে থাকার সুযোগ দেওয়া নয়, বরং মানুষকে বড় করে তোলা।" },
{ q: "সংকীর্ণ মানুষের প্রধান বৈশিষ্ট্য কী?", a: "সংকীর্ণ মানুষের প্রধান বৈশিষ্ট্য হলো অহংকার এবং অন্যের পথে বাধা সৃষ্টি করা।" },
{ q: "লেখকের মতে সমাজে কেমন মানুষ প্রয়োজন?", a: "সমাজে প্রয়োজন উদারহৃদয়, সংবেদনশীল ও গভীর চিন্তাশীল মানুষ।" },
{ q: "বৃক্ষকে সার্থকতা প্রতীক বলা হয়েছে কেন?", a: "বৃক্ষ ফুল-ফল দিয়ে অন্যের সেবা করে, তাই একে সার্থকতার প্রতীক বলা হয়।" },
{ q: "রবীন্দ্রনাথ কীকে মানবজীবনের প্রতীক করেছেন?", a: "রবীন্দ্রনাথ নদীর চলকে মানবজীবনের প্রতীক করেছেন।" },
{ q: "লেখকের মতে নদীর বদলে বৃক্ষকে প্রতীক হিসেবে দেওয়া উচিত কেন?", a: "বৃক্ষের সাফল্য সহজে দেখা যায়, নদীর সাফল্য ততটা স্পষ্ট নয়।" },
{ q: "বৃক্ষের কাজ কী?", a: "বৃক্ষ নিজের বৃদ্ধি সাধন করে এবং ফুল-ফল দিয়ে অন্যকে সেবা দেয়।" },
{ q: "বৃক্ষের কোন গুণ মানুষের সাধনার সঙ্গে মেলে?", a: "বৃক্ষের ধৈর্যশীলতা ও স্থিরতা মানুষের গোপন সাধনার সঙ্গে মেলে।" },
{ q: "মানুষের বৃদ্ধির বিশেষত্ব কী?", a: "মানুষের বৃদ্ধি কেবল দৈহিক নয়, আত্মিকও।" },
{ q: "বৃক্ষ কীভাবে শান্তির ইঙ্গিত দেয়?", a: "বৃক্ষ ধৈর্য ও সহিষ্ণুতার সঙ্গে জীবনের ভার বহন করে শান্তির ইঙ্গিত দেয়।" },
{ q: "আত্মা কীভাবে পরিপূর্ণ হয়?", a: "অভিজ্ঞতা, প্রেম ও গভীর অনুভূতির মাধ্যমে আত্মা পরিপূর্ণ হয়।" },
{ q: "‘Ripeness is all’ কথাটির অর্থ কী?", a: "পরিপক্কতাই জীবনের সবকিছু।" }
 ]

        const list = document.getElementById('cq-list');
        const bar = document.getElementById('progress-bar');
        const percentText = document.getElementById('prog-percent');
        let revealedCount = new Set();

        function render() {
            list.innerHTML = analysisData.map((item, i) => `
                <div class="cq-card" id="card-${i}">
                    <div class="q-meta">
                        <div class="q-index">${i + 1}</div>
                        <div class="q-tag">Knowledge Base</div>
                    </div>
                    <div class="q-statement">${item.q}</div>
                    <button class="reveal-trigger" onclick="reveal(${i})">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        <span>বিশ্লেষণ দেখুন</span>
                    </button>
                    <div class="ans-drawer">
                        <div class="ans-body">
                            <strong>বিশ্লেষণধর্মী উত্তর</strong>
                            ${item.a}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function reveal(index) {
            const card = document.getElementById(`card-${index}`);
            card.classList.toggle('is-active');
            
            if(card.classList.contains('is-active')) {
                revealedCount.add(index);
            }
            updateProgress();
        }

        function updateProgress() {
            const total = analysisData.length;
            const current = revealedCount.size;
            const percentage = Math.round((current / total) * 100);
            bar.style.width = percentage + '%';
            percentText.innerText = percentage + '%';
        }

        function toggleAll() {
            analysisData.forEach((_, i) => {
                const card = document.getElementById(`card-${i}`);
                if(!card.classList.contains('is-active')) {
                    card.classList.add('is-active');
                    revealedCount.add(i);
                }
            });
            updateProgress();
        }

        render();
    </script>
</body>
</html>
