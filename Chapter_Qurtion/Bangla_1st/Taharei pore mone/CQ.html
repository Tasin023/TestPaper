<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>তাহারেই পড়ে মনে</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;500;700&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #1A0A0F;
            --glass-core: rgba(107, 15, 32, 0.55);
            --glass-border: rgba(240, 100, 120, 0.12);
            --accent: #F2A0AE;
            --accent-glow: rgba(192, 37, 62, 0.35);
            --text-primary: #FDE8EC;
            --text-secondary: #C26070;
            --card-radius: 28px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(56, 189, 248, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(56, 189, 248, 0.05) 0%, transparent 40%);
            background-attachment: fixed;
            line-height: 1.6;
            padding-bottom: 120px;
        }

        /* --- High-End Header --- */
        header {
            padding: 80px 20px 40px;
            text-align: center;
            border-bottom: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
        }

        .category-tag {
            font-family: 'Outfit', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 5px;
            color: var(--accent);
            text-transform: uppercase;
            background: rgba(56, 189, 248, 0.1);
            padding: 6px 15px;
            border-radius: 50px;
            border: 1px solid var(--accent-glow);
        }

        header h1 {
            font-size: 3.5rem;
            margin: 20px 0 10px;
            font-weight: 700;
            background: linear-gradient(to bottom, #fff 30%, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p { color: var(--text-secondary); font-weight: 300; }

        /* --- Floating Navigation HUD --- */
        .mastery-hud {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 700px;
            background: var(--glass-core);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            z-index: 2000;
        }

        .progress-container { flex-grow: 1; margin: 0 40px; }
        .progress-label { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 8px; }
        .bar-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.05); border-radius: 10px; overflow: hidden; }
        .bar-fill { height: 100%; width: 0%; background: var(--accent); box-shadow: 0 0 15px var(--accent); transition: 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }

        /* --- CQ Analysis Cards --- */
        .container { width: 100%; max-width: 850px; margin: 50px auto; padding: 0 20px; }

        .cq-card {
            background: var(--glass-core);
            border: 1px solid var(--glass-border);
            border-radius: var(--card-radius);
            padding: 35px;
            margin-bottom: 30px;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .cq-card:hover {
            border-color: rgba(56, 189, 248, 0.4);
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .q-meta { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .q-index {
            background: var(--accent);
            color: #000;
            width: 28px; height: 28px;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-family: 'Outfit';
        }
        .q-tag { color: var(--accent); font-size: 0.85rem; font-weight: 600; text-transform: uppercase; }

        .q-statement { font-size: 1.4rem; font-weight: 500; color: #fff; margin-bottom: 25px; line-height: 1.4; }

        /* --- Premium Reveal Button --- */
        .reveal-trigger {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 12px 25px;
            border-radius: 15px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
        }

        .reveal-trigger:hover { background: var(--accent); color: #000; border-color: var(--accent); }

        /* --- Answer Drawer --- */
        .ans-drawer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(0, 0, 0, 0.2);
            border-radius: 20px;
        }

        .is-active .ans-drawer { max-height: 1000px; margin-top: 25px; border: 1px solid rgba(56, 189, 248, 0.1); }
        .is-active .reveal-trigger { background: var(--accent); color: #000; }

        .ans-body { padding: 25px; color: var(--text-secondary); font-size: 1.15rem; border-left: 4px solid var(--accent); }
        .ans-body strong { color: var(--accent); display: block; margin-bottom: 10px; font-size: 0.9rem; text-transform: uppercase; }

        /* --- Global Controls --- */
        .btn-ghost {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            padding: 8px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Outfit';
            font-size: 0.8rem;
            transition: 0.3s;
        }
        .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

        @media (max-width: 600px) {
            header h1 { font-size: 2.2rem; }
            .mastery-hud { flex-direction: column; gap: 15px; padding: 20px; border-radius: 25px; }
            .progress-container { margin: 10px 0; width: 100%; }
        }
    </style>
</head>
<style>
    .back-nav {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 1000;
    }

    .btn-back {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #fff;
        padding: 8px 16px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: all 0.3s ease;
        cursor: pointer;
    }

    .btn-back:hover {
        background: rgba(255, 255, 255, 0.1);
        transform: translateX(-5px);
        border-color: #00d2ff;
    }

    .btn-back i {
        color: #00d2ff;
    }
</style>

<body>

<!-- BACK BUTTON -->
<div class="back-nav">
    <button class="btn-back" onclick="history.back()">
        <i class="fas fa-chevron-left"></i> ফিরে যান
    </button>
</div>

    <header>
        <span class="category-tag">bangla first paper</span>
        <h1>তাহারেই পড়ে মনে/h1>
        <p>সুফিয়া কামাল — জ্ঞানমূলক ও অনুধাবনমূলক প্রশ্নোত্তর</p>
    </header>

    <div class="mastery-hud">
        <div class="hud-label" style="font-family:'Outfit'">TOPICS</div>
        <div class="progress-container">
            <div class="progress-label">
                <span>Mastery Progress</span>
                <span id="prog-percent">0%</span>
            </div>
            <div class="bar-bg"><div class="bar-fill" id="progress-bar"></div></div>
        </div>
        <button class="btn-ghost" onclick="toggleAll()">REVEAL ALL</button>
    </div>

    <main class="container" id="cq-list"></main>

    <script>
        const analysisData = [
{ q: "সুফিয়া কামালের পৈত্রিক নিবাস কোথায়?", a: "সুফিয়া কামালের পৈত্রিক নিবাস কুমিল্লায়।" },
{ q: "সুফিয়া কামালের পিতার নাম কী?", a: "সুফিয়া কামালের পিতার নাম সৈয়দ আবদুল বারী।" },
{ q: "সুফিয়া কামালের মাতার নাম কী?", a: "সুফিয়া কামালের মাতার নাম সাবেরা বেগম।" },
{ q: "সুফিয়া কমালের জন্ম কোথায়?", a: "বরিশালে।" },
{ q: "সুফিয়া কামালের জন্ম কত খ্রিষ্টাব্দে?", a: "১৯১১ খ্রিষ্টাব্দে।" },
{ q: "সুফিয়া কামাল কোন মাসের কত তারিখ জন্মগ্রহণ করেন?", a: "জুন মাসের ২০ তারিখ।" },
{ q: "কত খ্রিষ্টাব্দে সুফিয়া কামল মৃত্যুবরণ করেন?", a: "১৯৯৯ খ্রিষ্টাব্দে।" },
{ q: "বাংলাদেশের নারী আন্দোলনের পথিকৃৎ কে?", a: "বাংলাদেশের নারী আন্দোলনের পথিকৃৎ সুফিয়া কামাল।" },
{ q: "সুফিয়া কামাল কোন মাসের কত তারিখ মৃত্যুবরণ করেন?", a: "সুফিয়া কামাল নভেম্বর মাসের ২০ তারিখ মৃত্যুবরণ করেন।" },
{ q: "সুফিয়া কামাল কোথায় মৃত্যুবরণ করেন?", a: "সুফিয়া কামাল ঢাকায় মৃত্যুবরণ করেন।" },
{ q: "সুফিয়া কামালের কাব্য গ্রন্থগুলোর নাম লেখ।", a: "সুফিয়া কামালের কাব্য গ্রন্থগুলো হলো: 'সাঁঝের মায়া', 'মায়া কাজল', 'উদাত্ত পৃথিবী', 'মন ও জীবন', 'মৃত্তিকার ঘ্রাণ', 'প্রশান্তি ও প্রার্থনা'।" },
{ q: "সুফিয়া কামালের গল্পগ্রন্থের নাম কী?", a: "কেয়ার কাঁটা।" },
{ q: "সুফিয়া কামালের ভ্রমণকাহিনির নাম কী?", a: "সুফিয়া কামালের ভ্রমণকাহিনির নাম 'সোভিয়েতের দিনগুলি'।" },
{ q: "সুফিয়া কামাল রচিত স্মৃতিকথার নাম কী?", a: "সুফিয়া কামাল রচিত স্মৃতিকথার 'একাত্তরের ডায়েরী'।" },
{ q: "সুফিয়া কামাল রচিত শিশুতোষ গ্রন্থগুলো কী কী?", a: "গ্রন্থগুলো হলো: 'ইতল বিতল' ও 'নওল কিশোরের দরবারে'।" },
{ q: "কবির স্বামী সৈয়দ নেহাল হোসেন কত খ্রিষ্টাব্দে মারা যান?", a: "১৯৩২ খ্রিষ্টাব্দে।" },
{ q: "'তাহারেই পড়ে মনে' কবিতাটি কোন ছন্দে লেখা?", a: "'তাহারেই পড়ে মনে' কবিতাটি অক্ষরবৃত্ত ছন্দে লেখা।" },
{ q: "'তাহারেই পড়ে মনে' কবিতায় কোন ঋতুর আগমনের কথা বলা হয়েছে?", a: "বসন্ত ঋতুর আগমনের কথা বলা হয়েছে।" },
{ q: "'তাহারেই পড়ে মনে' কবিতাটি প্রথম কোন পত্রিকায় প্রকাশিত হয়?", a: "'তাহারেই পড়ে মনে' কবিতাটি প্রথম 'মাসিক মোহাম্মদী' পত্রিকায় প্রকাশিত হয়।" },
{ q: "'মাঘের সন্ন্যাসী' কাকে বলা হয়েছে?", a: "কবি শীতকে মাঘের সন্ন্যাসীরূপে কল্পনা করেছেন।" },
{ q: "'উন্মনা' শব্দের অর্থ কী?", a: "উৎকণ্ঠিত, ব্যাকুল, আনমনা, উদাস।" },
{ q: "'কহিল সে স্নিগ্ধ আঁখি তুলি'-কার আঁখি?", a: "কবির আঁখির কথা বলা হয়েছে।" },
{ q: "'তাহারেই পড়ে মনে' কবিতায় কবির নীরবতার কারণ কী?", a: "প্রিয়জন হারানোর শোক ও গভীর বেদনাবোধ।" },
{ q: "গঠনরীতির দিক থেকে 'তাহারেই পড়ে মনে' কবিতাটি কেমন?", a: "গঠনরীতির দিক থেকে 'তাহারেই পড়ে মনে' কবিতাটি সংলাপনির্ভর।" },
{ q: "মাঘের সন্ন্যাসী কোথায় চলে গেছে?", a: "মাঘের সন্ন্যাসী পুষ্পশূন্য দিগন্তের পথে চলে গেছে।" },
{ q: "'পুষ্পারতি' শব্দটি কোন অর্থে ব্যবহৃত হয়েছে?", a: "'পুষ্পারতি' শব্দটি ফুলের বন্দনা অর্থে ব্যবহৃত হয়েছে।" },
{ q: "'অর্ঘ্য বিরচন' অর্থ কী?", a: "অর্ঘ্য বিরচন শব্দের অর্থ উপহার রচনা।" }
 ]

        const list = document.getElementById('cq-list');
        const bar = document.getElementById('progress-bar');
        const percentText = document.getElementById('prog-percent');
        let revealedCount = new Set();

        function render() {
            list.innerHTML = analysisData.map((item, i) => `
                <div class="cq-card" id="card-${i}">
                    <div class="q-meta">
                        <div class="q-index">${i + 1}</div>
                        <div class="q-tag">Knowledge Base</div>
                    </div>
                    <div class="q-statement">${item.q}</div>
                    <button class="reveal-trigger" onclick="reveal(${i})">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        <span>বিশ্লেষণ দেখুন</span>
                    </button>
                    <div class="ans-drawer">
                        <div class="ans-body">
                            <strong>বিশ্লেষণধর্মী উত্তর</strong>
                            ${item.a}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function reveal(index) {
            const card = document.getElementById(`card-${index}`);
            card.classList.toggle('is-active');
            
            if(card.classList.contains('is-active')) {
                revealedCount.add(index);
            }
            updateProgress();
        }

        function updateProgress() {
            const total = analysisData.length;
            const current = revealedCount.size;
            const percentage = Math.round((current / total) * 100);
            bar.style.width = percentage + '%';
            percentText.innerText = percentage + '%';
        }

        function toggleAll() {
            analysisData.forEach((_, i) => {
                const card = document.getElementById(`card-${i}`);
                if(!card.classList.contains('is-active')) {
                    card.classList.add('is-active');
                    revealedCount.add(i);
                }
            });
            updateProgress();
        }

        render();
    </script>
</body>
</html>
