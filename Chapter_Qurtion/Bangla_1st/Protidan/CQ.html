<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রতিদান</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;500;700&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #1A0A0F;
            --glass-core: rgba(107, 15, 32, 0.55);
            --glass-border: rgba(240, 100, 120, 0.12);
            --accent: #F2A0AE;
            --accent-glow: rgba(192, 37, 62, 0.35);
            --text-primary: #FDE8EC;
            --text-secondary: #C26070;
            --card-radius: 28px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(56, 189, 248, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(56, 189, 248, 0.05) 0%, transparent 40%);
            background-attachment: fixed;
            line-height: 1.6;
            padding-bottom: 120px;
        }

        /* --- High-End Header --- */
        header {
            padding: 80px 20px 40px;
            text-align: center;
            border-bottom: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
        }

        .category-tag {
            font-family: 'Outfit', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 5px;
            color: var(--accent);
            text-transform: uppercase;
            background: rgba(56, 189, 248, 0.1);
            padding: 6px 15px;
            border-radius: 50px;
            border: 1px solid var(--accent-glow);
        }

        header h1 {
            font-size: 3.5rem;
            margin: 20px 0 10px;
            font-weight: 700;
            background: linear-gradient(to bottom, #fff 30%, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p { color: var(--text-secondary); font-weight: 300; }

        /* --- Floating Navigation HUD --- */
        .mastery-hud {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 700px;
            background: var(--glass-core);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            z-index: 2000;
        }

        .progress-container { flex-grow: 1; margin: 0 40px; }
        .progress-label { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 8px; }
        .bar-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.05); border-radius: 10px; overflow: hidden; }
        .bar-fill { height: 100%; width: 0%; background: var(--accent); box-shadow: 0 0 15px var(--accent); transition: 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }

        /* --- CQ Analysis Cards --- */
        .container { width: 100%; max-width: 850px; margin: 50px auto; padding: 0 20px; }

        .cq-card {
            background: var(--glass-core);
            border: 1px solid var(--glass-border);
            border-radius: var(--card-radius);
            padding: 35px;
            margin-bottom: 30px;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .cq-card:hover {
            border-color: rgba(56, 189, 248, 0.4);
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .q-meta { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .q-index {
            background: var(--accent);
            color: #000;
            width: 28px; height: 28px;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-family: 'Outfit';
        }
        .q-tag { color: var(--accent); font-size: 0.85rem; font-weight: 600; text-transform: uppercase; }

        .q-statement { font-size: 1.4rem; font-weight: 500; color: #fff; margin-bottom: 25px; line-height: 1.4; }

        /* --- Premium Reveal Button --- */
        .reveal-trigger {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 12px 25px;
            border-radius: 15px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
        }

        .reveal-trigger:hover { background: var(--accent); color: #000; border-color: var(--accent); }

        /* --- Answer Drawer --- */
        .ans-drawer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(0, 0, 0, 0.2);
            border-radius: 20px;
        }

        .is-active .ans-drawer { max-height: 1000px; margin-top: 25px; border: 1px solid rgba(56, 189, 248, 0.1); }
        .is-active .reveal-trigger { background: var(--accent); color: #000; }

        .ans-body { padding: 25px; color: var(--text-secondary); font-size: 1.15rem; border-left: 4px solid var(--accent); }
        .ans-body strong { color: var(--accent); display: block; margin-bottom: 10px; font-size: 0.9rem; text-transform: uppercase; }

        /* --- Global Controls --- */
        .btn-ghost {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            padding: 8px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Outfit';
            font-size: 0.8rem;
            transition: 0.3s;
        }
        .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

        @media (max-width: 600px) {
            header h1 { font-size: 2.2rem; }
            .mastery-hud { flex-direction: column; gap: 15px; padding: 20px; border-radius: 25px; }
            .progress-container { margin: 10px 0; width: 100%; }
        }
    </style>
</head>
<style>
    .back-nav {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 1000;
    }

    .btn-back {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #fff;
        padding: 8px 16px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: all 0.3s ease;
        cursor: pointer;
    }

    .btn-back:hover {
        background: rgba(255, 255, 255, 0.1);
        transform: translateX(-5px);
        border-color: #00d2ff;
    }

    .btn-back i {
        color: #00d2ff;
    }
</style>

<body>

<!-- BACK BUTTON -->
<div class="back-nav">
    <button class="btn-back" onclick="history.back()">
        <i class="fas fa-chevron-left"></i> ফিরে যান
    </button>
</div>

    <header>
        <span class="category-tag">bangla first paper</span>
        <h1>প্রতিদান</h1>
        <p>জসীম উদ্দীন — জ্ঞানমূলক ও অনুধাবনমূলক প্রশ্নোত্তর</p>
    </header>

    <div class="mastery-hud">
        <div class="hud-label" style="font-family:'Outfit'">TOPICS</div>
        <div class="progress-container">
            <div class="progress-label">
                <span>Mastery Progress</span>
                <span id="prog-percent">0%</span>
            </div>
            <div class="bar-bg"><div class="bar-fill" id="progress-bar"></div></div>
        </div>
        <button class="btn-ghost" onclick="toggleAll()">REVEAL ALL</button>
    </div>

    <main class="container" id="cq-list"></main>

    <script>
        const analysisData = [
{ q: "জসীম উদ্দীন কোন নামে অধিক পরিচিত?", a: "জসীম উদ্দীন 'পল্লীকবি' নামে অধিক পরিচিত ছিলেন।" },
{ q: "জসীম উদ্দীন কত সালে জন্মগ্রহণ করেন?", a: "জসীম উদ্দীনের জন্ম ১৯০৩ সালে।" },
{ q: "জসীমউদ্দীন কোন জেলায় জন্মগ্রহণ করেন?", a: "জসীমউদ্দীন ফরিদপুর জেলায় জন্মগ্রহণ করেন।" },
{ q: "জসীমউদ্দীনের পিতার নাম কী?", a: "আনসারউদ্দীন মোল্লা।" },
{ q: "জসীমউদ্দীন কোন কলেজ থেকে বিএ পাস করেন?", a: "ফরিদপুর রাজেন্দ্র কলেজ থেকে জসীমউদ্দীন বিএ পাস করেন।" },
{ q: "জসীমউদ্দীনকে ডিলিট ডিগ্রি প্রদান করে কোন বিশ্ববিদ্যালয়?", a: "জসীমউদ্দীনকে রবীন্দ্রভারতী বিশ্ববিদ্যালয় ডিলিট ডিগ্রি প্রদান করে।" },
{ q: "জসীমউদ্দীন কত সালে মৃত্যুবরণ করেন?", a: "জসীমউদ্দীন ১৯৭৬ সালে মৃত্যুবরণ করেন।" },
{ q: "জসীম উদ্দীনের কোন কাব্যগ্রন্থ বিদেশী ভাষায় অনূদিত হয়েছে?", a: "জসীম উদ্দীনের কাব্যগ্রন্থ 'নকশী কাঁথার মাঠ' বিদেশি ভাষায় অনূদিত হয়েছে।" },
{ q: "‘সোজন বাদিয়ার ঘাট’ কোন ধরনের রচনা?", a: "‘সোজন বাদিয়ার ঘাট’ একটি কবিতা।" },
{ q: "‘ধানখেত’ কি?", a: "‘ধানখেত’ একটি কাব্যগ্রন্থ।" },
{ q: "প্রতিদান কবিতাটি কোন কাব্যগ্রন্থের অন্তর্গত?", a: "প্রতিদান কবিতাটি বালুচর কাব্যগ্রন্থের অন্তর্গত।" },
{ q: "কবি ঘর ভাঙার প্রতিদানে কি করেছেন?", a: "ঘর ভাঙার প্রতিদানে কবি ঘর বেঁধে দিতে চেয়েছেন।" },
{ q: "কবি কার জন্য কেঁদে বেড়ান?", a: "কবি পরের জন্য কেঁদে বেড়ান।" },
{ q: "পরকে কবি কি করতে চেয়েছেন?", a: "কবি পরকে আপন করতে চেয়েছেন।" },
{ q: "কবি পথে পথে কাকে খোঁজেন?", a: "কবিকে যে পথের বিবাগী করেছে কবি তাকে পথে পথে খোঁজেন।" },
{ q: "কবির কূল ভেঙে দিলে কবি কি করেন?", a: "কবির কূল ভেঙে দিলে কবি তার কূল বেঁধে দেন।" },
{ q: "‘আমার এ কূল ভাঙিয়াছে যেবা আমি তার কূল বাঁধি’ এর পরবর্তী চরণ কি?", a: "পরবর্তী চরণ হলো— ‘যে গেছে বুকেতে আঘাত হানিয়া তার লাগি আমি কাঁদি।’" },
{ q: "কবি কোথায় আঘাত পেয়েছেন?", a: "কবি বুকে আঘাত পেয়েছেন।" },
{ q: "বুকে আঘাত পেলে কবি কি করেন?", a: "বুকে আঘাত পেলে কবি আঘাত প্রদানকারীর জন্য কাঁদেন।" },
{ q: "কবি কাকে বুকভরা গান দেওয়ার কথা বলেছেন?", a: "যে কবিকে বিষে-ভরা বাণ দিয়েছে কবি তাকে বুকভরা গান দেওয়ার কথা বলেছেন।" },
{ q: "বিষে-ভরা বাণের পরিবর্তে কবি কি দিয়েছেন?", a: "বিষে-ভরা বাণের পরিবর্তে কবি বুকভরা গান দিয়েছেন।" },
{ q: "কবি কাঁটা পেলে কি দান করেন?", a: "কবি কাঁটা পেলে ফুল দান করেন।" },
{ q: "কবি কিসের প্রতিদানে ফুল দান করেন?", a: "কবি কাঁটার প্রতিদানে ফুল দান করেন।" },
{ q: "কবরের প্রতিদানে কবি কি দিয়েছেন?", a: "কবরের প্রতিদানে কবি ফুল মালঞ্চ দিয়েছেন।" },
{ q: "প্রতিদান কবিতার ফুল মালঞ্চ কেমন?", a: "প্রতিদান কবিতার ফুল মালঞ্চ রঙিন ফুলের সোহাগ জড়ানো।" },
{ q: "কবি কেমন ফুল দিয়ে মালঞ্চ সাজিয়েছেন?", a: "কবি রঙিন ফুল দিয়ে মালঞ্চ সাজিয়েছেন।" },
{ q: "প্রতিদান কবিতায় কি সাজানোর কথা বলা হয়েছে?", a: "প্রতিদান কবিতায় সুখ সাজানোর কথা বলা হয়েছে।" },
{ q: "প্রতিদান কবিতায় কয়টি চরণ রয়েছে?", a: "প্রতিদান কবিতায় ১৮টি চরণ রয়েছে।" },
{ q: "কবি প্রতিদান কবিতায় কি কি বেঁধে দিতে চেয়েছেন?", a: "কবি প্রতিদান কবিতায় ঘর ও কূল বেঁধে দিতে চেয়েছেন।" },
{ q: "‘আপন করিতে কাঁদিয়া বেড়াই যে মোরে করেছে পর’ পঙক্তিটি কত বার ব্যবহৃত হয়েছে?", a: "আলোচ্য পঙক্তিটি প্রতিদান কবিতায় তিন বার ব্যবহৃত হয়েছে।" }
 ]

        const list = document.getElementById('cq-list');
        const bar = document.getElementById('progress-bar');
        const percentText = document.getElementById('prog-percent');
        let revealedCount = new Set();

        function render() {
            list.innerHTML = analysisData.map((item, i) => `
                <div class="cq-card" id="card-${i}">
                    <div class="q-meta">
                        <div class="q-index">${i + 1}</div>
                        <div class="q-tag">Knowledge Base</div>
                    </div>
                    <div class="q-statement">${item.q}</div>
                    <button class="reveal-trigger" onclick="reveal(${i})">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        <span>বিশ্লেষণ দেখুন</span>
                    </button>
                    <div class="ans-drawer">
                        <div class="ans-body">
                            <strong>বিশ্লেষণধর্মী উত্তর</strong>
                            ${item.a}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function reveal(index) {
            const card = document.getElementById(`card-${index}`);
            card.classList.toggle('is-active');
            
            if(card.classList.contains('is-active')) {
                revealedCount.add(index);
            }
            updateProgress();
        }

        function updateProgress() {
            const total = analysisData.length;
            const current = revealedCount.size;
            const percentage = Math.round((current / total) * 100);
            bar.style.width = percentage + '%';
            percentText.innerText = percentage + '%';
        }

        function toggleAll() {
            analysisData.forEach((_, i) => {
                const card = document.getElementById(`card-${i}`);
                if(!card.classList.contains('is-active')) {
                    card.classList.add('is-active');
                    revealedCount.add(i);
                }
            });
            updateProgress();
        }

        render();
    </script>
</body>
</html>
