<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

        :root {
            --accent-cyan: #00f2fe;
            --accent-purple: #4facfe;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
        }

        body {
            margin: 0;
            background: #02040a;
            color: #fff;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
            background: radial-gradient(circle at 50% 50%, #0c102b 0%, #02040a 100%);
        }

        /* 3D Background Grid Overlay */
        .grid-overlay {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: perspective(500px) rotateX(60deg) translateY(-100px) translateZ(-100px);
            transform-origin: top center;
            opacity: 0.6;
            z-index: 2;
            pointer-events: none;
        }

        .dashboard-wrapper {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            z-index: 10;
        }

        /* Modern Glassmorphic Search Bar */
        .premium-search {
            background: rgba(10, 15, 30, 0.4);
            border: 1px solid var(--border);
            backdrop-filter: blur(20px);
            transition: 0.4s ease;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
        }

        .premium-search:focus-within {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.2);
            transform: scale(1.02);
        }

        /* Main 3D Floating Button Element */
        .central-button-container {
            position: relative;
            margin-bottom: 4rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .three-d-base {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 28px;
            padding: 2.5rem 4rem;
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transform: perspective(800px) rotateX(20deg);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .three-d-core {
            background: linear-gradient(135deg, #00f2fe 0%, #9b51e0 100%);
            width: 140px;
            height: 50px;
            border-radius: 999px;
            box-shadow: 
                0 0 30px rgba(0, 242, 254, 0.6),
                0 8px 0 #6b21a8,
                inset 0 2px 4px rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            letter-spacing: 1px;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        .central-button-container:hover .three-d-base {
            transform: perspective(800px) rotateX(15deg) translateY(-5px);
            box-shadow: 0 25px 60px rgba(0, 242, 254, 0.15);
        }

        .central-button-container:active .three-d-core {
            transform: translateY(6px);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4), 0 2px 0 #6b21a8;
        }

        /* Waveform Animation Components */
        .wave-icon {
            display: flex;
            align-items: center;
            gap: 3px;
            height: 30px;
            opacity: 0.8;
        }

        .wave-bar {
            width: 3px;
            height: 100%;
            background: var(--accent-cyan);
            border-radius: 999px;
            animation: bounce 1.2s ease-in-out infinite alternate;
        }
        .wave-bar:nth-child(2) { animation-delay: 0.2s; height: 60%; }
        .wave-bar:nth-child(3) { animation-delay: 0.4s; height: 80%; }

        @keyframes bounce {
            0% { transform: scaleY(0.3); }
            100% { transform: scaleY(1.1); }
        }

        /* Bento Grid Layout */
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            max-width: 1050px;
            width: 100%;
            margin-bottom: 3rem;
        }

        .bento-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 2rem 1.5rem;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.4s ease;
            position: relative;
        }

        .bento-card:hover {
            border-color: var(--accent-cyan);
            transform: translateY(-8px);
            background: rgba(255, 255, 255, 0.04);
        }

        /* Interactive Element Containers for Three.js injection */
        .canvas-geometry-slot {
            width: 100%;
            height: 110px;
            margin-bottom: 0.5rem;
            pointer-events: none;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
        }

        @media (max-width: 768px) {
            .bento-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div class="grid-overlay"></div>

    <div class="dashboard-wrapper">
        <div class="premium-search flex items-center px-8 py-4 rounded-3xl mb-12">
            <i class="fas fa-search text-cyan-400 mr-4"></i>
            <input type="text" placeholder="কী খুঁজতে চান?" class="bg-transparent outline-none w-full text-lg text-white placeholder-gray-500">
        </div>

        <div class="central-button-container cursor-pointer">
            <div class="three-d-base flex items-center gap-8">
                <div class="wave-icon">
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                </div>
                
                <div class="three-d-core text-white text-center text-sm">
                    CORE
                </div>

                <div class="wave-icon">
                    <div class="wave-bar" style="animation-delay: 0.4s;"></div>
                    <div class="wave-bar" style="animation-delay: 0.2s;"></div>
                    <div class="wave-bar"></div>
                </div>
            </div>
        </div>

        <div class="bento-grid">
            <a href="Subject.html" class="bento-link">
                <div class="bento-card" data-shape="hexagon">
                    <div class="canvas-geometry-slot" id="geom-hex"></div>
                    <div class="text-cyan-400 text-sm font-semibold tracking-wider mb-1">SHAPES & STRUCTURES</div>
                    <div class="bento-text text-white text-lg">অধ্যায়ভিত্তিক প্রস্তুতি</div>
                </div>
            </a>

            <a href="Working.html" class="bento-link">
                <div class="bento-card" data-shape="torus">
                    <div class="canvas-geometry-slot" id="geom-torus"></div>
                    <div class="text-indigo-400 text-sm font-semibold tracking-wider mb-1">ACHIEVEMENTS</div>
                    <div class="bento-text text-white text-lg">বোর্ড প্রশ্ন প্রস্তুতি</div>
                </div>
            </a>

            <a href="Working.html" class="bento-link">
                <div class="bento-card" data-shape="panel">
                    <div class="canvas-geometry-slot" id="geom-panel"></div>
                    <div class="text-purple-400 text-sm font-semibold tracking-wider mb-1">RECOMMENDED</div>
                    <div class="bento-text text-white text-lg">সাজেশন</div>
                </div>
            </a>
        </div>

        <div class="text-center w-full">
            <div class="credit-text inline-block glass-card px-8 py-3 text-sm tracking-widest text-gray-400">
                MADE BY <span class="text-cyan-400 font-bold">TASIN SAIMON</span> 
                <span class="mx-2 text-gray-700">|</span> 
                IDEA BY <span class="text-purple-400 font-bold">MD EMON GAZI</span>
            </div>
        </div>
    </div>

    <script>
        // --- MULTI-CANVAS THREE.JS ARCHITECTURE ---
        const meshes = [];
        const container = document.getElementById('canvas-container');
        
        // Background Particle Scene Initialization
        const bgScene = new THREE.Scene();
        const bgCamera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const bgRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        bgRenderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(bgRenderer.domElement);

        // Particle field background structure generation
        const pGeometry = new THREE.BufferGeometry();
        const pCount = 80;
        const pPositions = new Float32Array(pCount * 3);
        for(let i=0; i<pCount*3; i+=3) {
            pPositions[i] = (Math.random() - 0.5) * 15;
            pPositions[i+1] = (Math.random() - 0.5) * 10;
            pPositions[i+2] = (Math.random() - 0.5) * 5;
        }
        pGeometry.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
        const pMaterial = new THREE.PointsMaterial({color: 0x00f2fe, size: 0.06, transparent: true, opacity: 0.5});
        const particles = new THREE.Points(pGeometry, pMaterial);
        bgScene.add(particles);
        bgCamera.position.z = 6;

        // Individual Geometry Sub-Scenes instantiation
        function initCardMesh(elemId, type) {
            const element = document.getElementById(elemId);
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(45, element.clientWidth / element.clientHeight, 0.1, 100);
            camera.position.z = 4;

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(element.clientWidth, element.clientHeight);
            element.appendChild(renderer.domElement);

            // Translucent glowing material configuration mirroring prompt asset properties
            const mat = new THREE.MeshPhysicalMaterial({
                color: 0x8ae2ff,
                emissive: 0x2244aa,
                roughness: 0.1,
                metalness: 0.1,
                transmission: 0.6,
                thickness: 0.5,
                transparent: true,
                opacity: 0.85
            });

            let geom;
            if(type === 'hex') {
                geom = new THREE.CylinderGeometry(0.7, 0.7, 0.3, 6);
            } else if(type === 'torus') {
                geom = new THREE.TorusGeometry(0.5, 0.18, 16, 100);
            } else {
                geom = new THREE.BoxGeometry(1, 0.6, 0.2); // Rounded Panel Proxy representation
            }

            const mesh = new THREE.Mesh(geom, mat);
            mesh.rotation.x = 0.5;
            mesh.rotation.y = 0.5;
            scene.add(mesh);

            // Lightning profile setup inside isolated bounding scopes
            const dirLight = new THREE.DirectionalLight(0x00ffff, 2);
            dirLight.position.set(1, 2, 3);
            scene.add(dirLight);
            
            const pointLight = new THREE.PointLight(0x9b51e0, 1.5, 10);
            pointLight.position.set(-2, -1, 1);
            scene.add(pointLight);

            meshes.push({ mesh, scene, camera, renderer, element });
        }

        // Initialize element slots
        initCardMesh('geom-hex', 'hex');
        initCardMesh('geom-torus', 'torus');
        initCardMesh('geom-panel', 'panel');

        // Combined global animation render engine loop execution frame
        function animate() {
            requestAnimationFrame(animate);

            // Animate global background systems
            particles.rotation.y += 0.0005;

            // Render active main container canvas context
            bgRenderer.render(bgScene, bgCamera);

            // Synchronize individual nested graphic element views
            meshes.forEach(item => {
                item.mesh.rotation.y += 0.01;
                item.mesh.rotation.x += 0.004;
                item.renderer.render(item.scene, item.camera);
            });
        }
        animate();

        // Responsive element mapping adjustment window update listener
        window.addEventListener('resize', () => {
            bgCamera.aspect = window.innerWidth / window.innerHeight;
            bgCamera.updateProjectionMatrix();
            bgRenderer.setSize(window.innerWidth, window.innerHeight);

            meshes.forEach(item => {
                const width = item.element.clientWidth;
                const height = item.element.clientHeight;
                item.camera.aspect = width / height;
                item.camera.updateProjectionMatrix();
                item.renderer.setSize(width, height);
            });
        });
    </script>
</body>
</html>
