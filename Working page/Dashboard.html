<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

        :root {
            --accent: #00d2ff;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
        }

        body {
            margin: 0;
            background: #050505;
            color: #fff;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, #0a192f 0%, #02040a 100%);
        }
         .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        /* The Dashboard Layout */
        .dashboard-wrapper {
            height: 100vh;
            display: grid;
            place-items: center;
            padding: 2rem;
            backdrop-filter: blur(10px);
        }

        /* Modern Search */
        .premium-search {
            background: var(--glass);
            border: 1px solid var(--border);
            backdrop-filter: blur(20px);
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
            max-width: 500px;
        }

        .premium-search:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.15);
            transform: scale(1.02);
        }

        /* Bento Grid Style Buttons */
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            max-width: 1000px;
            width: 100%;
        }

        .bento-item {
            position: relative;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 2.5rem 1.5rem;
            text-align: center;
            transition: all 0.5s ease;
            cursor: pointer;
            overflow: hidden;
        }

        /* Subtle Bubble Glow inside buttons */
        .bento-item::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(0, 210, 255, 0.15) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .bento-item:hover {
            border-color: var(--accent);
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.05);
        }

        .bento-item:hover::before {
            opacity: 1;
        }

        .icon-wrapper {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--accent);
            filter: drop-shadow(0 0 10px rgba(0, 210, 255, 0.3));
        }

        .bento-text {
            font-size: 1.1rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 0.5px;
        }

        /* Minimal Branding */
        .signature {
            position: fixed;
            bottom: 40px;
            font-size: 0.7rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            opacity: 0.4;
            color: #fff;
        }

        @media (max-width: 768px) {
            .bento-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="dashboard-wrapper">
        <!-- Search Section -->
        <div class="premium-search flex items-center px-8 py-4 rounded-3xl mb-12">
            <i class="fas fa-search text-cyan-400 mr-4"></i>
            <input type="text" placeholder="কী খুঁজতে চান?" class="bg-transparent outline-none w-full text-lg">
        </div>

        <!-- Bento Grid -->
       <div class="bento-grid">
    <!-- 1. Chapter Preparation -->
    <a href="Subject.html" class="bento-link">
        <div class="bento-item">
            <div class="icon-wrapper"><i class="fa-solid fa-shapes"></i></div>
            <div class="bento-text">অধ্যায়ভিত্তিক প্রস্তুতি</div>
        </div>
    </a>

    <!-- 2. Board Questions -->
    <a href="Working.html" class="bento-link">
        <div class="bento-item">
            <div class="icon-wrapper"><i class="fa-solid fa-medal"></i></div>
            <div class="bento-text">বোর্ড প্রশ্ন প্রস্তুতি</div>
        </div>
    </a>

    <!-- 5. Suggestions -->
    <a href="Working.html" class="bento-link">
        <div class="bento-item">
            <div class="icon-wrapper"><i class="fa-solid fa-bolt"></i></div>
            <div class="bento-text">সাজেশন</div>
        </div>
    </a>

        <div class="text-center">
            <div class="credit-text inline-block glass-card px-8 py-3 text-sm tracking-widest text-gray-400">
                MADE BY <span class="text-sky-400 font-bold">TASIN SAIMON</span> 
                <span class="mx-2 text-gray-600">|</span> 
                IDEA BY <span class="text-indigo-400 font-bold">MD EMON GAZI</span>
            </div>
        </div>
    </div>

    <script>
        // --- 3D SCENE SETUP ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Cinematic Lighting
        const light1 = new THREE.PointLight(0x00d2ff, 2, 50);
        light1.position.set(5, 5, 5);
        scene.add(light1);

        const light2 = new THREE.PointLight(0x7000ff, 1, 50);
        light2.position.set(-5, -5, 2);
        scene.add(light2);

        camera.position.z = 7;

        // Hover Effect Logic for Grid
        document.querySelectorAll('.bento-item').forEach(item => {
            item.addEventListener('mousemove', e => {
                const rect = item.getBoundingClientRect();
                const x = ((e.clientX - rect.left) / rect.width) * 100;
                const y = ((e.clientY - rect.top) / rect.height) * 100;
                item.style.setProperty('--x', `${x}%`);
                item.style.setProperty('--y', `${y}%`);
            });
        });

        function animate() {
            requestAnimationFrame(animate);
            book.rotation.y += 0.005;
            book.rotation.x += 0.003;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
