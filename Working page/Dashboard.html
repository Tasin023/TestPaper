<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

        :root {
            --accent: #ff451d; /* Changed to the image's vibrant coral red */
            --glass: rgba(255, 255, 255, 0.02);
            --border: rgba(255, 255, 255, 0.06);
        }

        body {
            margin: 0;
            background: #050505;
            color: #fff;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, #150b08 0%, #02040a 100%);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
        }

        /* The Dashboard Layout */
        .dashboard-wrapper {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            backdrop-filter: blur(4px);
            position: relative;
            z-index: 10;
        }

        /* Modern Search */
        .premium-search {
            background: var(--glass);
            border: 1px solid var(--border);
            backdrop-filter: blur(20px);
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
            max-width: 500px;
        }

        .premium-search:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 30px rgba(255, 69, 29, 0.2);
            transform: scale(1.02);
        }

        /* Bento Grid Style Buttons */
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            max-width: 1000px;
            width: 100%;
            margin-bottom: 3rem;
        }

        .bento-item {
            position: relative;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 2.5rem 1.5rem;
            text-align: center;
            transition: all 0.5s ease;
            cursor: pointer;
            overflow: hidden;
            height: 100%;
        }

        /* Subtle Bubble Glow inside buttons */
        .bento-item::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(255, 69, 29, 0.15) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .bento-item:hover {
            border-color: var(--accent);
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.05);
        }

        .bento-item:hover::before {
            opacity: 1;
        }

        .icon-wrapper {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--accent);
            filter: drop-shadow(0 0 10px rgba(255, 69, 29, 0.4));
        }

        .bento-text {
            font-size: 1.1rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 0.5px;
        }

        /* Background Memphis Accents directly from Image */
        .memphis-shape {
            position: absolute;
            opacity: 0.15;
            pointer-events: none;
            z-index: 1;
        }

        @media (max-width: 768px) {
            .bento-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="memphis-shape top-12 left-12 text-2xl tracking-widest text-white font-light">+++++<br>+++++</div>
    <div class="memphis-shape bottom-1/4 left-20 w-16 h-16 border-4 border-dashed border-white rounded-full"></div>
    <div class="memphis-shape top-1/3 right-12 text-4xl text-orange-500 font-bold select-none">✕</div>

    <div class="dashboard-wrapper">
        <div class="premium-search flex items-center px-8 py-4 rounded-3xl mb-12">
            <i class="fas fa-search text-orange-500 mr-4"></i>
            <input type="text" placeholder="কী খুঁজতে চান?" class="bg-transparent outline-none w-full text-lg text-white placeholder-gray-500">
        </div>

        <div class="bento-grid">
            <a href="Subject.html" class="bento-link">
                <div class="bento-item">
                    <div class="icon-wrapper"><i class="fa-solid fa-shapes"></i></div>
                    <div class="bento-text">অধ্যায়ভিত্তিক প্রস্তুতি</div>
                </div>
            </a>

            <a href="Working.html" class="bento-link">
                <div class="bento-item">
                    <div class="icon-wrapper"><i class="fa-solid fa-medal"></i></div>
                    <div class="bento-text">বোর্ড প্রশ্ন প্রস্তুতি</div>
                </div>
            </a>

            <a href="Working.html" class="bento-link">
                <div class="bento-item">
                    <div class="icon-wrapper"><i class="fa-solid fa-bolt"></i></div>
                    <div class="bento-text">সাজেশন</div>
                </div>
            </a>
        </div>

        <div class="text-center w-full z-10">
            <div class="credit-text inline-block glass-card px-8 py-3 text-sm tracking-widest text-gray-400">
                MADE BY <span class="text-orange-500 font-bold">TASIN SAIMON</span> 
                <span class="mx-2 text-gray-600">|</span> 
                IDEA BY <span class="text-amber-500 font-bold">MD EMON GAZI</span>
            </div>
        </div>
    </div>

    <script>
        // --- 3D SCENE SETUP ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Lights
        const light1 = new THREE.PointLight(0xff451d, 3, 50);
        light1.position.set(5, 5, 5);
        scene.add(light1);

        const light2 = new THREE.PointLight(0x333333, 2, 50);
        light2.position.set(-5, -5, 2);
        scene.add(light2);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
        scene.add(ambientLight);

        camera.position.z = 8;

        // --- CREATING SHAPES INSPIRED BY THE IMAGE ---
        const geometryGroup = new THREE.Group();
        const shapesCount = 15;
        const geometries = [
            new THREE.TorusGeometry(0.6, 0.15, 16, 100),         // Thick Rings
            new THREE.ConeGeometry(0.5, 1, 3),                   // Triangles
            new THREE.CylinderGeometry(0.4, 0.4, 0.8, 4),        // Diamond-ish Shapes
            new THREE.TorusGeometry(0.5, 0.05, 8, 50)            // Fine wire-looking loops
        ];

        // Materials match the color theme of the reference photo
        const materials = [
            new THREE.MeshStandardMaterial({ color: 0xff451d, roughness: 0.3, metalness: 0.1 }), // Vibrant Coral Red
            new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.5, metalness: 0.8 })  // Matte Black/Dark Grey
        ];

        for(let i = 0; i < shapesCount; i++) {
            const randomGeom = geometries[Math.floor(Math.random() * geometries.length)];
            const randomMat = materials[Math.floor(Math.random() * materials.length)];
            const mesh = new THREE.Mesh(randomGeom, randomMat);
            
            // Scatter them in space gently behind text
            mesh.position.set(
                (Math.random() - 0.5) * 14,
                (Math.random() - 0.5) * 8,
                (Math.random() - 0.5) * 4
            );
            
            mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
            
            // Assign random spin speeds
            mesh.userData = {
                spinX: (Math.random() - 0.5) * 0.01,
                spinY: (Math.random() - 0.5) * 0.01
            };
            
            geometryGroup.add(mesh);
        }
        scene.add(geometryGroup);

        // Hover Effect Dynamic Logic for Grid
        document.querySelectorAll('.bento-item').forEach(item => {
            item.addEventListener('mousemove', e => {
                const rect = item.getBoundingClientRect();
                const x = ((e.clientX - rect.left) / rect.width) * 100;
                const y = ((e.clientY - rect.top) / rect.height) * 100;
                item.style.setProperty('--x', `${x}%`);
                item.style.setProperty('--y', `${y}%`);
            });
        });

        // Fixed Animate Loop function
        function animate() {
            requestAnimationFrame(animate);
            
            // Slowly rotate the global cluster
            geometryGroup.rotation.y += 0.001;
            
            // Rotate each abstract shape on its custom axis
            geometryGroup.children.forEach(child => {
                child.rotation.x += child.userData.spinX;
                child.rotation.y += child.userData.spinY;
            });

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
